[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nr-ca-analyzer"
version = "0.1.0"
description = "5G NR Carrier Aggregation log analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
nr-ca-analyzer = "ca_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["ca_analyzer*"]
