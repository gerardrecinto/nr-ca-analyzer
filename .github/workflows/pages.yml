name: Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "ca_analyzer/**", "fixtures/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site
        run: |
          mkdir -p _site/py _site/logs
          cp site/index.html _site/
          for f in __init__ parser parser_str classifier reporter stats; do cp ca_analyzer/$f.py _site/py/; done
          cp fixtures/sample_events.log fixtures/sample_rlf.log _site/logs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
