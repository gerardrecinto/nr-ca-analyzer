# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!**/*.drawio"
    - "!fixtures/**"
  path_instructions:
    - path: "ca_analyzer/**"
      instructions: "Python 3.11+. Check: regex escaping, walrus operator, match/case coverage, generator streaming patterns."
    - path: "tests/**"
      instructions: "pytest. FIXTURES constant for fixture paths. Parser tests verify field values, not just event counts."
chat:
  auto_reply: true
